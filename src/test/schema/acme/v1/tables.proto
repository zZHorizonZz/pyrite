    collation: [
      { key: "postgresql" value: "C" },
      { key: "mariadb" value: "utf8mb4_bin" },
      { key: "sqlserver" value: "Latin1_General_100_BIN2" }
    ]
  }];

  optional string parent = 3 [(leadseal.v1.column).text = { length: 255 }];

  optional string display_name = 4 [(leadseal.v1.column).text = { length: 255 }];

  string labels = 5 [(leadseal.v1.column).json = {}];

  int64 revision = 6;

  string create_time = 7 [(leadseal.v1.column).timestamp = {}];

  string update_time = 8 [(leadseal.v1.column).timestamp = {}];

  optional string delete_time = 9 [(leadseal.v1.column).timestamp = {}];

  optional string purge_time = 10 [(leadseal.v1.column).timestamp = {}];
}

