syntax = "proto3";

package pyrite.keys.v1;

import "leadseal/v1/options.proto";

option java_multiple_files = false;
option java_outer_classname = "Tables";
option java_package = "dev.horizon.pyrite.schema.keys.v1";

// A key: the resource pyrite.dev/Key, with the standard fields and its own.
message Key {
  option (leadseal.v1.table) = {
    name: "pyrite_key"
    index: [
      { fields: ["name"] unique: true },
      { fields: ["parent"] }
    ]
  };

  string uid = 1 [(leadseal.v1.column) = { primary_key: true uuid: { default_random: true } }];

  string name = 2 [(leadseal.v1.column) = {
    text: {
      length: 255
      collation: [
        { key: "postgresql" value: "C" },
        { key: "mariadb" value: "utf8mb4_bin" },
        { key: "sqlserver" value: "Latin1_General_100_BIN2" }
      ]
    }
    foreign_key: { message: "pyrite.declaration.v1.Node" field: "name" on_delete: ACTION_CASCADE }
  }];

  optional string parent = 3 [(leadseal.v1.column).text = { length: 255 }];

  optional string display_name = 4 [(leadseal.v1.column).text = { length: 255 }];

  string labels = 5 [(leadseal.v1.column).json = { default_value: "{}" }];

  int64 revision = 6 [(leadseal.v1.column) = { integer: { default_value: 1 } rewrite: "old.revision + 1" }];

  string create_time = 7 [(leadseal.v1.column).timestamp = { default_now: true }];

  string update_time = 8 [(leadseal.v1.column) = { timestamp: { default_now: true } rewrite: "now()" }];

  optional string delete_time = 9 [(leadseal.v1.column).timestamp = {}];

  optional string purge_time = 10 [(leadseal.v1.column).timestamp = {}];

  enum Purpose {
    PURPOSE_UNSPECIFIED = 0;
    ENCRYPTION = 1;
    MAC = 2;
    SIGNING = 3;
  }

  enum Algorithm {
    ALGORITHM_UNSPECIFIED = 0;
    AES256_GCM = 1;
    HMAC_SHA256 = 2;
    RS256 = 3;
    ES256 = 4;
    EDDSA = 5;
  }

  Purpose purpose = 11;

  Algorithm algorithm = 12;

  // How often the key gets a new primary version, in seconds; 0 for never.
  int64 rotation_period = 13;

  // When the key next gets a new primary version, if it rotates.
  optional string next_rotation_time = 14 [(leadseal.v1.column).timestamp = {}];

  // The name of the version that encrypts and signs.
  string primary_version = 15 [(leadseal.v1.column).text = { length: 255 }];
}

// A version of a key: the resource pyrite.dev/KeyVersion, under its key.
message KeyVersion {
  option (leadseal.v1.table) = {
    name: "pyrite_key_version"
    index: [
      { fields: ["name"] unique: true },
      { fields: ["parent", "number"] unique: true }
    ]
  };

  string uid = 1 [(leadseal.v1.column) = { primary_key: true uuid: { default_random: true } }];

  string name = 2 [(leadseal.v1.column).text = {
    length: 255
    collation: [
      { key: "postgresql" value: "C" },
      { key: "mariadb" value: "utf8mb4_bin" },
      { key: "sqlserver" value: "Latin1_General_100_BIN2" }
    ]
  }];

  optional string parent = 3 [(leadseal.v1.column) = {
    text: {
      length: 255
      collation: [
        { key: "postgresql" value: "C" },
        { key: "mariadb" value: "utf8mb4_bin" },
        { key: "sqlserver" value: "Latin1_General_100_BIN2" }
      ]
    }
    foreign_key: { message: "pyrite.keys.v1.Key" field: "name" on_delete: ACTION_CASCADE }
  }];

  optional string display_name = 4 [(leadseal.v1.column).text = { length: 255 }];

  string labels = 5 [(leadseal.v1.column).json = { default_value: "{}" }];

  int64 revision = 6 [(leadseal.v1.column) = { integer: { default_value: 1 } rewrite: "old.revision + 1" }];

  string create_time = 7 [(leadseal.v1.column).timestamp = { default_now: true }];

  string update_time = 8 [(leadseal.v1.column) = { timestamp: { default_now: true } rewrite: "now()" }];

  optional string delete_time = 9 [(leadseal.v1.column).timestamp = {}];

  optional string purge_time = 10 [(leadseal.v1.column).timestamp = {}];

  // 1 for the first version of the key, and one more for each after it.
  int64 number = 11;

  enum State {
    STATE_UNSPECIFIED = 0;
    ENABLED = 1;
    DISABLED = 2;
  }

  State state = 12;

  Key.Algorithm algorithm = 13;

  // The public key of a signing version, as a JWK; empty for the others.
  optional string public_key = 14 [(leadseal.v1.column).json = {}];

  // The key material, encrypted by the root key.
  bytes sealed = 15;

  // The X.509 SubjectPublicKeyInfo of a signing version; empty for the others.
  optional bytes public_key_info = 16;
}
