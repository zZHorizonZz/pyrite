syntax = "proto3";

package pyrite.declaration.v1;

import "leadseal/v1/options.proto";

option java_multiple_files = false;
option java_outer_classname = "Tables";
option java_package = "dev.horizon.pyrite.schema.declaration.v1";

// A declaration that pyrite.schema.v1.Schema wrote, with the store of grants and the model that it wrote for it. The
// latest is the one that every service reads. Each declaration is written on the one that was the latest, and no two
// on the same one, so that of two Pyrites that write at once, one writes again on the declaration of the other.
message Declaration {
  option (leadseal.v1.table) = {
    name: "pyrite_declaration"
    index: [
      { fields: ["create_time"] },
      { fields: ["previous_id"] unique: true }
    ]
  };

  string id = 1 [(leadseal.v1.column) = { primary_key: true text: { length: 36 } }];

  // The pyrite.schema.v1.Declaration, serialized.
  bytes declaration = 2;

  // The OpenFGA store of the grants.
  string store_id = 3 [(leadseal.v1.column).text = { length: 26 }];

  // The authorization model that the declaration wrote to the store.
  string model_id = 4 [(leadseal.v1.column).text = { length: 26 }];

  string create_time = 5 [(leadseal.v1.column).timestamp = { default_now: true }];

  // The id of the declaration that was the latest when this one was written; empty for the first.
  string previous_id = 6 [(leadseal.v1.column).text = { length: 36 }];
}

// A resource that Pyrite knows: its type and the resource it is under. The application keeps the resource itself;
// Pyrite keeps where it sits, so that grants reach it from its parents and nothing is made twice.
message Node {
  option (leadseal.v1.table) = {
    name: "pyrite_node"
    index: [
      { fields: ["parent"] },
      { fields: ["type"] }
    ]
  };

  // The resource's name, such as projects/ledger.
  string name = 1 [(leadseal.v1.column) = {
    primary_key: true
    text: {
      length: 255
      collation: [
        { key: "postgresql" value: "C" },
        { key: "mariadb" value: "utf8mb4_bin" },
        { key: "sqlserver" value: "Latin1_General_100_BIN2" }
      ]
    }
  }];

  // The declared type, such as acme.dev/Project.
  string type = 2 [(leadseal.v1.column).text = { length: 255 }];

  // The name of the resource it is under; unset for a resource at the top.
  optional string parent = 3 [(leadseal.v1.column) = {
    text: {
      length: 255
      collation: [
        { key: "postgresql" value: "C" },
        { key: "mariadb" value: "utf8mb4_bin" },
        { key: "sqlserver" value: "Latin1_General_100_BIN2" }
      ]
    }
    foreign_key: { message: "pyrite.declaration.v1.Node" field: "name" on_delete: ACTION_RESTRICT }
  }];

  string create_time = 4 [(leadseal.v1.column).timestamp = { default_now: true }];
}
