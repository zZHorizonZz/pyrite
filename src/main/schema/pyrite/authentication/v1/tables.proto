syntax = "proto3";

package pyrite.authentication.v1;

import "leadseal/v1/options.proto";

option java_multiple_files = false;
option java_outer_classname = "Tables";
option java_package = "dev.horizon.pyrite.schema.authentication.v1";

// An account: the resource pyrite.dev/Account, whose principals are user:<id>.
message Account {
  option (leadseal.v1.table) = {
    name: "pyrite_account"
    index: [
      { fields: ["name"] unique: true }
    ]
  };

  string uid = 1 [(leadseal.v1.column) = { primary_key: true uuid: { default_random: true } }];

  string name = 2 [(leadseal.v1.column) = {
    text: {
      length: 255
      collation: [
        { key: "postgresql" value: "C" },
        { key: "mariadb" value: "utf8mb4_bin" },
        { key: "sqlserver" value: "Latin1_General_100_BIN2" }
      ]
    }
    foreign_key: { message: "pyrite.declaration.v1.Node" field: "name" on_delete: ACTION_CASCADE }
  }];

  optional string parent = 3 [(leadseal.v1.column).text = { length: 255 }];

  optional string display_name = 4 [(leadseal.v1.column).text = { length: 255 }];

  string labels = 5 [(leadseal.v1.column).json = { default_value: "{}" }];

  int64 revision = 6 [(leadseal.v1.column) = { integer: { default_value: 1 } rewrite: "old.revision + 1" }];

  string create_time = 7 [(leadseal.v1.column).timestamp = { default_now: true }];

  string update_time = 8 [(leadseal.v1.column) = { timestamp: { default_now: true } rewrite: "now()" }];

  optional string delete_time = 9 [(leadseal.v1.column).timestamp = {}];

  optional string purge_time = 10 [(leadseal.v1.column).timestamp = {}];

  enum Kind {
    KIND_UNSPECIFIED = 0;
    HUMAN = 1;
    SERVICE = 2;
  }

  Kind kind = 11;
}

// An identifier of an account: the resource pyrite.dev/Identifier, under its account.
message Identifier {
  option (leadseal.v1.table) = {
    name: "pyrite_identifier"
    index: [
      { fields: ["name"] unique: true },
      { fields: ["parent"] },
      { fields: ["kind", "value"] unique: true }
    ]
  };

  string uid = 1 [(leadseal.v1.column) = { primary_key: true uuid: { default_random: true } }];

  string name = 2 [(leadseal.v1.column).text = {
    length: 255
    collation: [
      { key: "postgresql" value: "C" },
      { key: "mariadb" value: "utf8mb4_bin" },
      { key: "sqlserver" value: "Latin1_General_100_BIN2" }
    ]
  }];

  optional string parent = 3 [(leadseal.v1.column) = {
    text: {
      length: 255
      collation: [
        { key: "postgresql" value: "C" },
        { key: "mariadb" value: "utf8mb4_bin" },
        { key: "sqlserver" value: "Latin1_General_100_BIN2" }
      ]
    }
    foreign_key: { message: "pyrite.authentication.v1.Account" field: "name" on_delete: ACTION_CASCADE }
  }];

  optional string display_name = 4 [(leadseal.v1.column).text = { length: 255 }];

  string labels = 5 [(leadseal.v1.column).json = { default_value: "{}" }];

  int64 revision = 6 [(leadseal.v1.column) = { integer: { default_value: 1 } rewrite: "old.revision + 1" }];

  string create_time = 7 [(leadseal.v1.column).timestamp = { default_now: true }];

  string update_time = 8 [(leadseal.v1.column) = { timestamp: { default_now: true } rewrite: "now()" }];

  optional string delete_time = 9 [(leadseal.v1.column).timestamp = {}];

  optional string purge_time = 10 [(leadseal.v1.column).timestamp = {}];

  // EMAIL, PHONE or USERNAME.
  string kind = 11 [(leadseal.v1.column).text = { length: 16 }];

  // The address, the number in E.164, or the username, as Pyrite normalized it.
  string value = 12 [(leadseal.v1.column).text = {
    length: 320
    collation: [
      { key: "postgresql" value: "C" },
      { key: "mariadb" value: "utf8mb4_bin" },
      { key: "sqlserver" value: "Latin1_General_100_BIN2" }
    ]
  }];

  bool verified = 13;

  // Whether the account prefers it among its identifiers; the caller sets it.
  bool primary = 14;
}

// A factor of an account: the resource pyrite.dev/Factor, under its account.
message Factor {
  option (leadseal.v1.table) = {
    name: "pyrite_factor"
    index: [
      { fields: ["name"] unique: true },
      { fields: ["parent"] },
      { fields: ["credential_id"] }
    ]
  };

  string uid = 1 [(leadseal.v1.column) = { primary_key: true uuid: { default_random: true } }];

  string name = 2 [(leadseal.v1.column).text = {
    length: 255
    collation: [
      { key: "postgresql" value: "C" },
      { key: "mariadb" value: "utf8mb4_bin" },
      { key: "sqlserver" value: "Latin1_General_100_BIN2" }
    ]
  }];

  optional string parent = 3 [(leadseal.v1.column) = {
    text: {
      length: 255
      collation: [
        { key: "postgresql" value: "C" },
        { key: "mariadb" value: "utf8mb4_bin" },
        { key: "sqlserver" value: "Latin1_General_100_BIN2" }
      ]
    }
    foreign_key: { message: "pyrite.authentication.v1.Account" field: "name" on_delete: ACTION_CASCADE }
  }];

  optional string display_name = 4 [(leadseal.v1.column).text = { length: 255 }];

  string labels = 5 [(leadseal.v1.column).json = { default_value: "{}" }];

  int64 revision = 6 [(leadseal.v1.column) = { integer: { default_value: 1 } rewrite: "old.revision + 1" }];

  string create_time = 7 [(leadseal.v1.column).timestamp = { default_now: true }];

  string update_time = 8 [(leadseal.v1.column) = { timestamp: { default_now: true } rewrite: "now()" }];

  optional string delete_time = 9 [(leadseal.v1.column).timestamp = {}];

  optional string purge_time = 10 [(leadseal.v1.column).timestamp = {}];

  enum Kind {
    KIND_UNSPECIFIED = 0;
    PASSWORD = 1;
    TOTP = 2;
    PASSKEY = 3;
    RECOVERY_CODES = 4;
    PROVIDER = 5;
  }

  enum State {
    STATE_UNSPECIFIED = 0;
    PENDING = 1;
    ACTIVE = 2;
  }

  Kind kind = 11;

  // PENDING while it is enrolled, then ACTIVE.
  State state = 12;

  // The password's Argon2id hash, the TOTP secret encrypted, the passkey's credential, the recovery codes' MACs, or the
  // provider account as its sign-in proved it.
  bytes secret = 13;

  // A passkey's credential id, or the provider and the id of a provider account, as google:1093...; empty for the
  // others.
  string credential_id = 14 [(leadseal.v1.column).text = { length: 255 }];

  // A passkey's signature counter, or the last TOTP step that signed in.
  int64 counter = 15;

  // Whether a passkey verified its user when it was registered.
  bool user_verified = 16;
}

// A session of an account: the resource pyrite.dev/Session, under its account.
message Session {
  option (leadseal.v1.table) = {
    name: "pyrite_session"
    index: [
      { fields: ["name"] unique: true },
      { fields: ["parent"] }
    ]
  };

  string uid = 1 [(leadseal.v1.column) = { primary_key: true uuid: { default_random: true } }];

  string name = 2 [(leadseal.v1.column).text = {
    length: 255
    collation: [
      { key: "postgresql" value: "C" },
      { key: "mariadb" value: "utf8mb4_bin" },
      { key: "sqlserver" value: "Latin1_General_100_BIN2" }
    ]
  }];

  optional string parent = 3 [(leadseal.v1.column) = {
    text: {
      length: 255
      collation: [
        { key: "postgresql" value: "C" },
        { key: "mariadb" value: "utf8mb4_bin" },
        { key: "sqlserver" value: "Latin1_General_100_BIN2" }
      ]
    }
    foreign_key: { message: "pyrite.authentication.v1.Account" field: "name" on_delete: ACTION_CASCADE }
  }];

  optional string display_name = 4 [(leadseal.v1.column).text = { length: 255 }];

  string labels = 5 [(leadseal.v1.column).json = { default_value: "{}" }];

  int64 revision = 6 [(leadseal.v1.column) = { integer: { default_value: 1 } rewrite: "old.revision + 1" }];

  string create_time = 7 [(leadseal.v1.column).timestamp = { default_now: true }];

  string update_time = 8 [(leadseal.v1.column) = { timestamp: { default_now: true } rewrite: "now()" }];

  optional string delete_time = 9 [(leadseal.v1.column).timestamp = {}];

  optional string purge_time = 10 [(leadseal.v1.column).timestamp = {}];

  reserved 11;
  reserved "token_mac";

  string expire_time = 12 [(leadseal.v1.column).timestamp = {}];

  string idle_expire_time = 13 [(leadseal.v1.column).timestamp = {}];
}

// The account at a provider that a factor of the kind PROVIDER links. The provider and the id are unique together, so
// that no account at a provider is linked to two accounts. It goes with its factor.
message ProviderLink {
  option (leadseal.v1.table) = {
    name: "pyrite_provider_link"
    index: [{ fields: ["provider", "account_id"] unique: true }]
  };

  // The factor.
  string factor = 1 [(leadseal.v1.column) = {
    primary_key: true
    text: {
      length: 255
      collation: [
        { key: "postgresql" value: "C" },
        { key: "mariadb" value: "utf8mb4_bin" },
        { key: "sqlserver" value: "Latin1_General_100_BIN2" }
      ]
    }
    foreign_key: { message: "pyrite.authentication.v1.Factor" field: "name" on_delete: ACTION_CASCADE }
  }];

  // The name of the provider in the options, such as google.
  string provider = 2 [(leadseal.v1.column).text = { length: 63 }];

  // The id of the account at the provider.
  string account_id = 3 [(leadseal.v1.column).text = { length: 255 }];
}

// A refresh token of a session. A refresh trades it for the next, so a token works once; one that comes back after its
// trade ends its session. It goes with its session.
message RefreshToken {
  option (leadseal.v1.table) = {
    name: "pyrite_refresh_token"
    index: [{ fields: ["session"] }]
  };

  // The id of the token, before the dot in the token.
  string id = 1 [(leadseal.v1.column) = { primary_key: true text: { length: 36 } }];

  // The session.
  string session = 2 [(leadseal.v1.column) = {
    text: {
      length: 255
      collation: [
        { key: "postgresql" value: "C" },
        { key: "mariadb" value: "utf8mb4_bin" },
        { key: "sqlserver" value: "Latin1_General_100_BIN2" }
      ]
    }
    foreign_key: { message: "pyrite.authentication.v1.Session" field: "name" on_delete: ACTION_CASCADE }
  }];

  // The MAC of the token's secret, which the MAC key of the options signs.
  bytes mac = 3;

  string create_time = 4 [(leadseal.v1.column).timestamp = { default_now: true }];

  // When a refresh traded the token for the next; unset while it works.
  optional string use_time = 5 [(leadseal.v1.column).timestamp = {}];
}

// An exchange in progress. It is not a resource: only the Authentication service reads and writes it.
message Exchange {
  option (leadseal.v1.table) = { name: "pyrite_exchange" };

  string id = 1 [(leadseal.v1.column) = { primary_key: true text: { length: 36 } }];

  string definition = 2 [(leadseal.v1.column).text = { length: 63 }];

  // The account; unset for an exchange that names no account that exists.
  optional string account = 3 [(leadseal.v1.column) = {
    text: {
      length: 255
      collation: [
        { key: "postgresql" value: "C" },
        { key: "mariadb" value: "utf8mb4_bin" },
        { key: "sqlserver" value: "Latin1_General_100_BIN2" }
      ]
    }
    foreign_key: { message: "pyrite.authentication.v1.Account" field: "name" on_delete: ACTION_CASCADE }
  }];

  // The identifier that the exchange started with, if any.
  optional string identifier = 4 [(leadseal.v1.column).text = { length: 255 }];

  int64 revision = 5;

  // The stage of the definition that the exchange is in.
  int32 stage = 6;

  // What the answers of the stage have proven, as JSON.
  string proofs = 7 [(leadseal.v1.column).json = {}];

  int32 answers = 8;

  string expire_time = 9 [(leadseal.v1.column).timestamp = {}];

  // The random nonce of the stage, which a passkey answer signs, and when it, and what the verifiers keep with it, stop
  // working.
  optional bytes nonce = 10;

  optional string nonce_expire_time = 11 [(leadseal.v1.column).timestamp = {}];

  // What the verifiers keep for the stage, such as the MAC of the code that was sent, as JSON by the name of the
  // answer.
  string state = 12 [(leadseal.v1.column).json = {}];

  // The factor that the exchange enrolls, if any.
  optional string factor = 13 [(leadseal.v1.column).text = { length: 255 }];

  // The id of the last answer's request, and the exchange that it returned.
  optional string request_id = 14 [(leadseal.v1.column).text = { length: 64 }];

  optional bytes response = 15;

  // Whether the exchange is done; a done exchange takes no answers.
  bool done = 16;

  // The account at a provider that the exchange creates an account for, as a ProviderAccount.
  optional bytes provider_account = 17;
}
