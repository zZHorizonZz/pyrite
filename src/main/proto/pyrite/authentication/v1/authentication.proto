syntax = "proto3";

package pyrite.authentication.v1;

import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "AuthenticationProto";
option java_package = "dev.horizon.pyrite.authentication.v1";

// Accounts and their identifiers, and sign-in, verification, recovery and enrolment, as exchanges that the declaration
// defines, with the credentials that they issue. An account is the resource pyrite.dev/Account: reading it and its
// identifiers needs viewer on it, and changing them needs admin.
service Authentication {
  // Creates an account, which owns itself. The subject gets the relation that pyrite.dev/Account grants its
  // creator.
  rpc CreateAccount(CreateAccountRequest) returns (Account);

  // Gives an account.
  rpc GetAccount(GetAccountRequest) returns (Account);

  // Deletes an account, its identifiers, factors and sessions, and every grant on it and to it.
  rpc DeleteAccount(DeleteAccountRequest) returns (google.protobuf.Empty);

  // Adds an identifier to an account, unverified. An exchange that marks it verified proves it. An identifier that
  // another account has already fails with ALREADY_EXISTS.
  rpc AddIdentifier(AddIdentifierRequest) returns (Identifier);

  // Lists the identifiers of an account.
  rpc ListIdentifiers(ListIdentifiersRequest) returns (ListIdentifiersResponse);

  // Lists the active factors of an account.
  rpc ListFactors(ListFactorsRequest) returns (ListFactorsResponse);

  // Removes a factor of an account, such as a lost passkey, or a linked provider account, which can then be linked
  // again. The account keeps a factor that signs in on its own: a password, a passkey or a linked provider account.
  rpc DeleteFactor(DeleteFactorRequest) returns (google.protobuf.Empty);

  // Gives a session of an account.
  rpc GetSession(GetSessionRequest) returns (Session);

  // Ends a session, so that its token signs nobody in again.
  rpc EndSession(EndSessionRequest) returns (google.protobuf.Empty);

  // Deletes the sessions that have ended, the factors that were removed or replaced, and the factors whose enrolment
  // was never finished. Call it now and then.
  rpc Purge(PurgeRequest) returns (PurgeResponse);

  // Starts an exchange of a definition. It gives the challenges that the exchange takes first; an exchange that needs
  // none is done at once.
  rpc StartExchange(StartExchangeRequest) returns (Exchange);

  // Answers a challenge of an exchange. It gives the next challenges, or the result once the exchange is done. A wrong
  // answer fails, and counts against the exchange's answers.
  rpc ContinueExchange(ContinueExchangeRequest) returns (Exchange);

  // Gives the principal of a credential, such as an access token. The session of the token must not have ended.
  rpc Authenticate(AuthenticateRequest) returns (Principal);

  // Trades a refresh token for a new access token and a new refresh token, and extends the idle lifetime of the
  // session. A refresh token works once: one that comes back after its trade ends its session.
  rpc RefreshSession(RefreshSessionRequest) returns (TokenSet);
}

message StartExchangeRequest {
  // The account that starts it, for an exchange whose input is SUBJECT or SUBJECT_IDENTIFIER; empty otherwise.
  string subject = 1;

  // The name of the exchange definition, such as sign-in.
  string definition = 2;

  reserved 3;

  // The identifier, as the person typed it, for an exchange whose input is IDENTIFIER or SUBJECT_IDENTIFIER.
  string identifier = 4;

  // The identifier's kind, such as email. Leave it empty to take the first kind of the declaration whose match the
  // identifier meets.
  string identifier_kind = 5;
}

message Exchange {
  // The name, such as exchanges/0b0d....
  string name = 1;

  string definition = 2;

  // The revision that an answer names.
  int64 revision = 3;

  google.protobuf.Timestamp expire_time = 4;

  // The answers that the exchange takes next; empty once it is done.
  repeated Challenge challenges = 5;

  // The codes that the caller sends.
  repeated Delivery deliveries = 6;

  // What the exchange did, once it is done.
  Result result = 7;

  // The provider account that the exchange links to its account when it ends, such as one whose verified email an
  // account holds; the application can tell the person that the next answer links it.
  ProviderAccount provider_account = 8;
}

message Challenge {
  // The full name of the answer's message, such as pyrite.authentication.v1.PasswordAnswer.
  string method = 1;

  // What the answer needs, such as PasskeyOptions or TotpProvisioning; empty for most.
  google.protobuf.Any parameters = 2;
}

// A code for the application to send to an identifier. The application decides how, by the identifier's kind.
message Delivery {
  reserved 1;
  reserved "channel";

  // The identifier's value, such as an email address.
  string to = 2;

  string code = 3;

  google.protobuf.Timestamp expire_time = 4;

  // The identifier's kind, such as email.
  string kind = 5;

  // The identifier's name, such as identifiers/0b0d....
  string identifier = 6;
}

message Result {
  reserved 1;
  reserved "resources";

  // The account of the exchange, such as accounts/anne.
  string account = 3;

  // The identifiers that the exchange verified.
  repeated Identifier identifiers = 4;

  // The factors that the exchange activated.
  repeated Factor factors = 5;

  // The sessions that the exchange issued.
  repeated Session sessions = 6;


  // The credentials that are shown once, such as a TokenSet or RecoveryCodes.
  repeated google.protobuf.Any issued = 2;
}

message ContinueExchangeRequest {
  // The exchange's name.
  string exchange = 1;

  // The exchange's revision that the answer answers.
  int64 revision = 2;

  // An id that the caller chooses, so that a retry gives the first result.
  string request_id = 3;

  // The answer: one of the answer messages, whose type is its method.
  google.protobuf.Any answer = 4;
}

message AuthenticateRequest {
  oneof credential {
    string access_token = 1;
  }
}

message Principal {
  // The subject, such as user:anne.
  string subject = 1;

  // The account, such as accounts/anne.
  string account = 2;

  // The session, for an access token.
  string session = 3;

  google.protobuf.Timestamp expire_time = 4;
}

// A password: the account's, when signing in, or a new one, when enrolling.
message PasswordAnswer {
  string password = 1;
}

message TotpAnswer {
  string code = 1;
}

message RecoveryCodeAnswer {
  string code = 1;
}

message CodeAnswer {
  string code = 1;
}

// A WebAuthn credential in JSON: an assertion when signing in, an attestation when enrolling.
message PasskeyAnswer {
  string credential = 1;
}

// The WebAuthn options in JSON: request options when signing in, creation options when enrolling.
message PasskeyOptions {
  string options = 1;
}

message TotpProvisioning {
  // The otpauth URI for the authenticator app.
  string uri = 1;
}

// The parameters of a code challenge: the identifier that the code went to. The application shows the person where,
// in whatever form it likes.
message CodeSent {
  reserved 1, 2;
  reserved "channel", "to";

  // The identifier's name, such as identifiers/0b0d....
  string identifier = 3;

  // The identifier's kind, such as email.
  string kind = 4;
}

// The tokens of a session, which Pyrite gives out once: a short-lived access token, which a caller sends with each
// call, and a refresh token, which it trades for new tokens before the access token expires.
message TokenSet {
  // The session's name, such as sessions/....
  string session = 1;

  // A JWT of type at+jwt, which the access token key of the options signs.
  string access_token = 2;

  google.protobuf.Timestamp access_token_expire_time = 3;

  // An opaque token, which works once, until the session ends.
  string refresh_token = 4;
}

// The answer of a sign-in at a provider: what the provider gave to the callback of the application.
message ProviderAnswer {
  // The name of the provider in the options, such as google.
  string provider = 1;

  // The code of the callback.
  string code = 2;

  // The state of the callback.
  string state = 3;
}

// The parameters of the challenge of a sign-in at a provider: where to send the person, per provider.
message ProviderRedirects {
  repeated ProviderRedirect redirects = 1;
}

message ProviderRedirect {
  // The name of the provider in the options, such as google.
  string provider = 1;

  // The authorization URL, with the state, the PKCE challenge and, for OpenID Connect, the nonce of the stage.
  string authorization_url = 2;
}

// An account at a provider, as a sign-in at the provider proves it.
message ProviderAccount {
  // The name of the provider in the options, such as google.
  string provider = 1;

  // The id of the account at the provider: the sub of OpenID Connect, or the id of its user info.
  string id = 2;

  string email = 3;

  // Whether the provider says that it verified the email.
  bool email_verified = 4;
}

message RefreshSessionRequest {
  // The refresh token, as the last TokenSet gave it.
  string refresh_token = 1;
}

message RecoveryCodes {
  repeated string codes = 1;
}

message Account {
  // The name, such as accounts/anne.
  string name = 1;

  Kind kind = 2;

  google.protobuf.Timestamp create_time = 3;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    HUMAN = 1;
    SERVICE = 2;
  }
}

message Identifier {
  // The name, such as identifiers/0b0d....
  string name = 1;

  // The account, such as accounts/anne.
  string account = 2;

  reserved 3;

  // The kind, such as email, as the declaration names it.
  string kind = 7;

  // The value, as the kind normalizes it.
  string value = 4;

  bool verified = 5;

  bool primary = 6;
}

message Factor {
  // The name, such as factors/0b0d....
  string name = 1;

  // The account, such as accounts/anne.
  string account = 2;

  Kind kind = 3;

  // The name of the provider in the options, such as google, for a factor of the kind PROVIDER.
  string provider = 4;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    PASSWORD = 1;
    TOTP = 2;
    PASSKEY = 3;
    RECOVERY_CODES = 4;
    PROVIDER = 5;
  }
}

message Session {
  // The name, such as sessions/0b0d....
  string name = 1;

  // The account, such as accounts/anne.
  string account = 2;

  google.protobuf.Timestamp expire_time = 3;
}

message CreateAccountRequest {
  string subject = 1;

  // The account's id, the last segment of its name.
  string account_id = 2;

  Account.Kind kind = 3;
}

message GetAccountRequest {
  string subject = 1;

  // The account's name.
  string name = 2;
}

message DeleteAccountRequest {
  string subject = 1;

  // The account's name.
  string name = 2;
}

message AddIdentifierRequest {
  string subject = 1;

  // The account's name.
  string account = 2;

  reserved 3;

  // The value, as given; Pyrite normalizes it as its kind says.
  string value = 4;

  // Whether the identifier is the account's primary one of its kind.
  bool primary = 5;

  // The kind, such as email. Leave it empty to take the first kind of the declaration whose match the value meets.
  string kind = 6;
}

message ListIdentifiersRequest {
  string subject = 1;

  // The account's name.
  string account = 2;
}

message ListIdentifiersResponse {
  repeated Identifier identifiers = 1;
}

message ListFactorsRequest {
  string subject = 1;

  // The account's name.
  string account = 2;
}

message ListFactorsResponse {
  repeated Factor factors = 1;
}

message DeleteFactorRequest {
  string subject = 1;

  // The factor's name, such as factors/0b0d....
  string name = 2;
}

message GetSessionRequest {
  string subject = 1;

  // The session's name.
  string name = 2;
}

message EndSessionRequest {
  string subject = 1;

  // The session's name.
  string name = 2;
}

message PurgeRequest {}

message PurgeResponse {
  // How many rows the purge deleted.
  int64 purged = 1;
}
