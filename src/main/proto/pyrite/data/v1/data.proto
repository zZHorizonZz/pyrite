syntax = "proto3";

package pyrite.data.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "DataProto";
option java_package = "dev.horizon.pyrite.data.v1";

// The resources of the application's declared types. Every call runs as its subject.
service Data {
  // Creates a resource under its parent. The subject needs the type's create permission on the parent.
  rpc CreateResource(CreateResourceRequest) returns (Resource);

  // Returns a resource. The subject needs the type's read permission on it.
  rpc GetResource(GetResourceRequest) returns (Resource);

  // Returns a page of the resources of a type that the subject has a permission on.
  rpc QueryResources(QueryResourcesRequest) returns (QueryResourcesResponse);

  // Replaces the fields of a resource that the mask names. The subject needs the type's update permission on it.
  rpc UpdateResource(UpdateResourceRequest) returns (Resource);

  // Moves a resource under another parent. The subject needs the update permission on it and the create permission
  // on the new parent.
  rpc MoveResource(MoveResourceRequest) returns (Resource);

  // Deletes a resource until its retention ends. The subject needs the type's delete permission on it.
  rpc DeleteResource(DeleteResourceRequest) returns (Resource);

  // Makes a deleted resource active again before its retention ends. The subject needs the delete permission on it.
  rpc UndeleteResource(UndeleteResourceRequest) returns (Resource);

  // Removes the deleted resources whose retention has ended, with their grants. Call it on a schedule.
  rpc PurgeResources(PurgeResourcesRequest) returns (PurgeResourcesResponse);
}

// A resource: its name, its type, and its fields, the standard ones and the type's own.
message Resource {
  // The name, such as projects/ledger.
  string name = 1;

  // The declared type, such as acme.dev/Project.
  string type = 2;

  // The fields, by the names of the type's columns.
  map<string, Value> fields = 3;
}

// The value of a field.
message Value {
  oneof kind {
    google.protobuf.NullValue null_value = 1;
    bool bool_value = 2;
    int64 integer_value = 3;
    double double_value = 4;
    string string_value = 5;
    bytes bytes_value = 6;
    google.protobuf.Timestamp timestamp_value = 7;
    ArrayValue array_value = 8;
    MapValue map_value = 9;
  }
}

message ArrayValue {
  repeated Value values = 1;
}

message MapValue {
  map<string, Value> fields = 1;
}

message CreateResourceRequest {
  // The subject that creates it, such as user:anne.
  string subject = 1;

  // The parent's name, or empty for a type without parents.
  string parent = 2;

  // The id, the last segment of the name.
  string resource_id = 3;

  // The type and the fields to set. The standard fields are Pyrite's, except display_name and labels.
  Resource resource = 4;

  // The values that the conditions of grants read, such as current_time.
  google.protobuf.Struct context = 5;
}

message GetResourceRequest {
  string subject = 1;

  string name = 2;

  // The values that the conditions of grants read, such as current_time.
  google.protobuf.Struct context = 3;
}

message QueryResourcesRequest {
  string subject = 1;

  // The declared type, such as acme.dev/Project.
  string type = 2;

  // The permission that the subject needs on each resource; the type's read permission when empty.
  string permission = 3;

  // An AIP-160 filter on the columns, such as labels.env = "prod".
  string filter = 4;

  // An AIP-132 order on the columns.
  string order_by = 5;

  int32 page_size = 6;

  string page_token = 7;

  // Whether deleted resources are included.
  bool show_deleted = 8;

  // The values that the conditions of grants read, such as current_time.
  google.protobuf.Struct context = 9;
}

message QueryResourcesResponse {
  // The resources of the page. A page can hold fewer than the page size, even none, before the last.
  repeated Resource resources = 1;

  string next_page_token = 2;
}

message UpdateResourceRequest {
  string subject = 1;

  // The name and the fields to set.
  Resource resource = 2;

  // The fields to set.
  google.protobuf.FieldMask update_mask = 3;

  // The revision that the subject read.
  int64 revision = 4;

  // The values that the conditions of grants read, such as current_time.
  google.protobuf.Struct context = 5;
}

message MoveResourceRequest {
  string subject = 1;

  string name = 2;

  // The new parent's name.
  string parent = 3;

  int64 revision = 4;

  // The values that the conditions of grants read, such as current_time.
  google.protobuf.Struct context = 5;
}

message DeleteResourceRequest {
  string subject = 1;

  string name = 2;

  int64 revision = 3;

  // The values that the conditions of grants read, such as current_time.
  google.protobuf.Struct context = 4;
}

message UndeleteResourceRequest {
  string subject = 1;

  string name = 2;

  int64 revision = 3;

  // The values that the conditions of grants read, such as current_time.
  google.protobuf.Struct context = 4;
}

message PurgeResourcesRequest {
}

message PurgeResourcesResponse {
  // The number of resources removed.
  int64 purged = 1;
}
