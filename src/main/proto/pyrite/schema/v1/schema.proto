syntax = "proto3";

package pyrite.schema.v1;

import "google/protobuf/timestamp.proto";
import "openfga/v1/authzmodel.proto";

option java_multiple_files = true;
option java_outer_classname = "SchemaProto";
option java_package = "dev.horizon.pyrite.schema.v1";

// The declaration of the application's types, conditions, identifier kinds and exchanges, which every other service of
// Pyrite reads.
service Schema {
  // Checks a declaration, writes its authorization model to OpenFGA, and makes it the latest. Every service uses the
  // latest declaration from then on.
  rpc WriteDeclaration(WriteDeclarationRequest) returns (WriteDeclarationResponse);

  // Gives a declaration: the one that the request names, or the latest.
  rpc ReadDeclaration(ReadDeclarationRequest) returns (ReadDeclarationResponse);
}

message Declaration {
  repeated Type types = 1;

  // The conditions that relations name, by name.
  map<string, openfga.v1.Condition> conditions = 2;

  repeated ExchangeDefinition exchanges = 3;

  // The kinds of identifiers that accounts have, such as email or username. An exchange that starts from what a person
  // typed takes the first kind, in this order, whose match the value meets.
  repeated IdentifierKind identifier_kinds = 4;
}

// A kind of identifier that the application gives accounts. Pyrite stores and compares identifiers; the application
// decides what they look like and sends the codes that prove them.
message IdentifierKind {
  // The kind's name, such as email or employee-id: a lowercase letter, then lowercase letters, digits and hyphens.
  string name = 1;

  // A CEL expression over value, the string as given, which is true when the value is of this kind, such as
  // value.matches('^[^@\\s]+@[^@\\s]+$'). It can use the strings extension.
  string match = 2;

  // A CEL expression over value that gives the string that Pyrite stores and compares, such as
  // value.trim().lowerAscii(). Leave it empty to keep the value as given. The normalized value must still match.
  string normalize = 3;

  // Whether the application sends codes to identifiers of this kind, so that an exchange verifies one or signs in with
  // a code sent to it. A username takes no codes; an email address does.
  bool receives_codes = 4;
}

// A type of the application's resources, as Pyrite knows it: where it sits in the hierarchy and who may do what on
// its resources. The application keeps the resources themselves. Pyrite's own types, pyrite.dev/Key and
// pyrite.dev/Account, leave plural empty.
message Type {
  // The type's name, such as acme.dev/Project.
  string name = 1;

  // The first segment of its resources' names, such as projects.
  string plural = 2;

  // The types that its resources can be under; none for a type at the top.
  repeated string parents = 3;

  reserved 4, 5, 10;
  reserved "table", "fields", "retention";

  // The OpenFGA type: its name, which is the type's singular name, its relations, and the types that each takes
  // directly. A relation reads from the parent through a tuple to userset whose tupleset is parent; Pyrite adds the
  // relation parent to a type that has parents.
  openfga.v1.TypeDefinition definition = 6;

  // The relations that pyrite.access.v1.Access checks.
  Permissions permissions = 7;

  // The relations that pyrite.access.v1.Access grants and revokes.
  repeated string grantable = 8;

  // The relation that the creator of a resource is granted on it; empty for none.
  string creator = 9;
}

message Permissions {
  // The relation on the parent that creates a resource under it; empty for a type without parents.
  string create = 1;

  reserved 2, 3, 4;
  reserved "read", "update", "delete";

  // The relation that grants, revokes and lists the grants on a resource.
  string grant = 5;
}

// An exchange of pyrite.authentication.v1.Authentication: what it takes, what has to be proven, stage by stage, and
// what follows.
message ExchangeDefinition {
  // The name, such as sign-in.
  string name = 1;

  Input input = 2;

  repeated Stage stages = 3;

  repeated Completion completes = 4;

  // What an exchange of the input NONE does with a provider account that no account links, whose provider verified an
  // email address that a verified identifier of an account holds.
  EmailMatch email_match = 5;

  enum Input {
    INPUT_UNSPECIFIED = 0;
    // An identifier, such as an email address.
    IDENTIFIER = 1;
    // The account that calls.
    SUBJECT = 2;
    // The account that calls, and one of its identifiers.
    SUBJECT_IDENTIFIER = 3;
    // Nothing: an answer names the account, such as a sign-in at a provider.
    NONE = 4;
  }

  enum EmailMatch {
    // The email address reaches no account: the exchange creates one, with CREATE_ACCOUNT, or refuses.
    EMAIL_MATCH_UNSPECIFIED = 0;
    // The provider sign-in signs in to the account, and the exchange links the provider account to it.
    SIGN_IN = 1;
    // The exchange asks for a factor of the account, and links the provider account once the stage is met.
    CONFIRM = 2;
  }

  enum Completion {
    COMPLETION_UNSPECIFIED = 0;
    ISSUE_SESSION = 1;
    MARK_VERIFIED = 2;
    ACTIVATE_FACTOR = 3;
    END_SESSIONS = 4;
    // Creates an account for an account at a provider that is linked to none, and links it. It needs the input NONE.
    CREATE_ACCOUNT = 5;
  }
}

// What one stage of an exchange requires: distinct factors, phishing resistance, a code sent to the identifier, or the
// enrolment of a factor, which is a stage of its own.
message Stage {
  int32 factors = 1;

  bool phishing_resistant = 2;

  bool identifier = 3;

  Factor enrol = 4;

  enum Factor {
    FACTOR_UNSPECIFIED = 0;
    PASSWORD = 1;
    TOTP = 2;
    PASSKEY = 3;
    RECOVERY_CODES = 4;
    PROVIDER = 5;
  }
}

message WriteDeclarationRequest {
  Declaration declaration = 1;
}

message WriteDeclarationResponse {
  // The id of the declaration.
  string id = 1;
}

message ReadDeclarationRequest {
  // The id of the declaration; empty for the latest.
  string id = 1;
}

message ReadDeclarationResponse {
  string id = 1;

  Declaration declaration = 2;

  google.protobuf.Timestamp create_time = 3;
}
